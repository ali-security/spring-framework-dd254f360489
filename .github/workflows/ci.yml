name: CI
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test selector (e.g. ":spring-core:test --tests FooTests"); empty runs the full suite'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  ci:
    name: '${{ matrix.os.name}} | Java ${{ matrix.java.version}} | ${{ matrix.group.name }}'
    runs-on: ${{ matrix.os.id }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os:
          - id: ubuntu-latest
            name: Linux
        java:
          - version: 8
            toolchain: false
          - version: 17
            toolchain: true
          - version: 21
            toolchain: true
        group:
          - name: core-context
            artifact: true
            tasks: ':check :framework-bom:check :spring-jcl:check :spring-core:check :spring-beans:check :spring-aop:check :spring-aspects:check :spring-expression:check :spring-instrument:check :spring-context:check :spring-context-indexer:check :spring-context-support:check :spring-core:jar'
          - name: data-messaging-test
            artifact: false
            tasks: ':spring-tx:check :spring-jdbc:check :spring-orm:check :spring-oxm:check :spring-r2dbc:check :spring-jms:check :spring-messaging:check :spring-test:check :integration-tests:check'
          - name: web-websocket
            artifact: false
            tasks: ':spring-web:check :spring-websocket:check'
          - name: webflux
            artifact: false
            tasks: ':spring-webflux:check'
          - name: webmvc
            artifact: false
            tasks: ':spring-webmvc:check'
        exclude:
          - os:
              name: Linux
            java:
              version: 8
    steps:
      - name: Prepare Windows runner
        if: ${{ runner.os == 'Windows' }}
        run: |
          git config --global core.autocrlf true
          git config --global core.longPaths true
          Stop-Service -name Docker
      - name: Check Out Code
        uses: actions/checkout@v4
      - name: Build
        id: build
        if: ${{ inputs.test-filter == '' || matrix.group.artifact }}
        uses: ./.github/actions/build
        with:
          java-version: ${{ matrix.java.version }}
          java-early-access: ${{ matrix.java.early-access || 'false' }}
          java-toolchain: ${{ matrix.java.toolchain }}
          develocity-access-key: ${{ secrets.GRADLE_ENTERPRISE_SECRET_ACCESS_KEY }}
          tasks: ${{ inputs.test-filter != '' && format(':spring-core:jar {0}', inputs.test-filter) || format('{0} --continue --no-build-cache', matrix.group.tasks) }}
      - name: Test Report
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/seal_test_report.py "${{ matrix.group.name }} | Java ${{ matrix.java.version }}"
      - name: Upload spring-core jar
        if: ${{ matrix.group.artifact && matrix.java.version == 17 }}
        uses: actions/upload-artifact@v4
        with:
          name: spring-core-jar
          path: spring-core/build/libs/spring-core-5.3.39.jar
          if-no-files-found: error
